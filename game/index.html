<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Garden — Spot the Difference</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #171226;
    color: #f5ead6;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  header {
    width: 1280px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 20px 6px;
  }
  header h1 { font-size: 26px; letter-spacing: 1px; color: #ffd98a; white-space: nowrap; }
  header .round { font-size: 15px; color: #cbb8ff; font-style: italic; white-space: nowrap; }
  header .spacer { flex: 1; }
  .stat {
    background: #241b3d;
    border: 1px solid #4a3670;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 15px;
    white-space: nowrap;
  }
  .stat b { color: #ffd98a; }
  .stat.low b { color: #ff7a6b; }
  button {
    font-family: Georgia, serif;
    font-size: 15px;
    background: #3a2a5e;
    color: #ffe9b8;
    border: 1px solid #6b4fa3;
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { background: #4a3670; }
  button:disabled { opacity: 0.4; cursor: default; }
  #boards { display: flex; gap: 20px; padding: 4px 20px 0; }
  .panel { position: relative; }
  .panel canvas { display: block; border: 2px solid #4a3670; border-radius: 6px; background: #0d0a18; cursor: crosshair; }
  .panel .tag {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(245, 234, 214, 0.85);
    text-shadow: 0 1px 3px #000;
    pointer-events: none;
  }
  #message {
    width: 1280px;
    text-align: center;
    font-size: 16px;
    font-style: italic;
    color: #cbb8ff;
    padding: 8px 20px 4px;
    min-height: 30px;
  }
  footer {
    width: 1280px;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 2px 20px 8px;
    font-size: 13px;
    color: #8f7fb8;
  }
  footer .dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid #6b4fa3; display: inline-block; margin-right: 4px;
  }
  footer .dot.done { background: #ffd98a; }
  footer .dot.now { background: #7ee787; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(13, 9, 24, 0.82);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    background: #241b3d;
    border: 1px solid #6b4fa3;
    border-radius: 14px;
    padding: 30px 44px;
    text-align: center;
    max-width: 560px;
  }
  #overlay h2 { font-size: 32px; color: #ffd98a; margin-bottom: 12px; }
  #overlay p { font-size: 17px; line-height: 1.55; margin-bottom: 10px; }
  #overlay .big { font-size: 22px; color: #ffe9b8; }
  #overlay button { font-size: 18px; padding: 10px 26px; margin-top: 10px; }
</style>
</head>
<body>
  <header>
    <h1>&#127878; Lantern Garden</h1>
    <span class="round" id="roundLabel">Round 1 · Lantern Garden at Dusk</span>
    <span class="spacer"></span>
    <span class="stat" id="counter">Found <b>0</b> · 7 to go</span>
    <span class="stat" id="timer">&#9201; <b>3:00</b></span>
    <span class="stat" id="score">Score <b>0</b></span>
    <button id="hintBtn" type="button">Hint (3)</button>
    <button id="soundBtn" type="button">Sound: on</button>
  </header>
  <div id="boards">
    <div class="panel"><canvas id="left" width="600" height="600"></canvas><span class="tag">A · ORIGINAL</span></div>
    <div class="panel"><canvas id="right" width="600" height="600"></canvas><span class="tag">B · FIND THE CHANGES</span></div>
  </div>
  <div id="message">Click a difference on either picture. Seven hide in this garden.</div>
  <footer id="progress"></footer>
  <div id="overlay"><div class="card" id="overlayCard"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
